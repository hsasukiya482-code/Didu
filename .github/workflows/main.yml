name: Build Android APK from Zip or Repo

on:
  push:
    branches: [ main, master ]

  workflow_dispatch:
    inputs:
      zip_url:
        description: 'Optional direct URL to download zip'
        required: false
        default: ''

jobs:
  build-apk:
    name: Auto Extract & Build Test Mitra APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4


      # 2. Find and Extract ZIP
      - name: Auto Find & Extract Zip File
        run: |
          echo "=== Checking for ZIP files ==="

          if [ -n "${{ github.event.inputs.zip_url }}" ]; then
            echo "Downloading ZIP..."
            curl -L "${{ github.event.inputs.zip_url }}" -o uploaded_app.zip
          fi

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP: $ZIP_FILE"

            rm -rf extracted_temp
            mkdir -p extracted_temp

            unzip -o "$ZIP_FILE" -d extracted_temp/

            echo "=== Detecting project root ==="

            if [ -f "extracted_temp/package.json" ]; then
              cp -r extracted_temp/* .
            else
              SUBDIR=$(find extracted_temp -mindepth 1 -maxdepth 1 -type d | head -n 1)

              if [ -n "$SUBDIR" ] && [ -f "$SUBDIR/package.json" ]; then
                cp -r "$SUBDIR"/* .
              else
                echo "Searching deeper for package.json..."

                PROJECT_DIR=$(find extracted_temp -type f -name "package.json" -print -quit | xargs -r dirname)

                if [ -n "$PROJECT_DIR" ]; then
                  cp -r "$PROJECT_DIR"/* .
                else
                  echo "ERROR: package.json not found."
                  exit 1
                fi
              fi
            fi

            rm -rf extracted_temp

            echo "=== ZIP extraction completed ==="

          else
            echo "No ZIP found."
            echo "Using repository files."
          fi


      # 3. Check Project
      - name: Check Project Files
        run: |
          echo "=== Project root ==="
          pwd

          echo "=== Files ==="
          ls -la

          echo "=== package.json ==="

          if [ -f "package.json" ]; then
            echo "package.json FOUND"
          else
            echo "ERROR: package.json NOT FOUND"
            exit 1
          fi


      # 4. Setup Node.js
      # IMPORTANT:
      # No npm cache here because ZIP is extracted during workflow.
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # 5. Install Dependencies
      - name: Install Dependencies
        run: |
          echo "=== Installing dependencies ==="

          if [ -f "package-lock.json" ]; then
            echo "package-lock.json found"
            npm ci || npm install
          else
            echo "package-lock.json not found"
            npm install
          fi


      # 6. Build Web Application
      - name: Build Web Application
        run: |
          echo "=== Building web application ==="

          npm run build

          echo "=== Checking dist ==="

          if [ -d "dist" ]; then
            echo "dist folder FOUND"
            ls -la dist
          else
            echo "ERROR: dist folder not found"
            exit 1
          fi


      # 7. Setup Java 17
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'


      # 8. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # 9. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3


      # 10. Enable AndroidX
      - name: Enable AndroidX
        run: |
          echo "=== Enabling AndroidX ==="

          mkdir -p android

          touch android/gradle.properties

          if ! grep -q "^android.useAndroidX=" android/gradle.properties; then
            echo "android.useAndroidX=true" >> android/gradle.properties
          fi

          if ! grep -q "^android.enableJetifier=" android/gradle.properties; then
            echo "android.enableJetifier=true" >> android/gradle.properties
          fi

          if ! grep -q "^org.gradle.jvmargs=" android/gradle.properties; then
            echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> android/gradle.properties
          fi

          echo "=== gradle.properties ==="
          cat android/gradle.properties


      # 11. Sync Web App to Android
      - name: Sync Assets to Android Project
        run: |
          echo "=== Preparing Android assets ==="

          mkdir -p android/app/src/main/assets/public

          rm -rf android/app/src/main/assets/public/*

          cp -r dist/* android/app/src/main/assets/public/

          echo "=== Assets copied ==="

          ls -la android/app/src/main/assets/public/


      # 12. Check Android Project
      - name: Check Android Project
        run: |
          echo "=== Checking Android project ==="

          if [ ! -d "android" ]; then
            echo "ERROR: android folder not found"
            exit 1
          fi

          if [ ! -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            echo "ERROR: Android app Gradle file not found"
            exit 1
          fi

          echo "Android project found."


      # 13. Create Gradle Wrapper
      - name: Prepare Gradle Wrapper
        run: |
          cd android

          echo "=== Creating Gradle Wrapper ==="

          gradle wrapper \
            --gradle-version 8.2 \
            --distribution-type all

          chmod +x gradlew

          echo "Gradle wrapper ready."


      # 14. Clean
      - name: Clean Android Project
        run: |
          cd android

          chmod +x gradlew

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # 15. Build APK
      - name: Build Test Mitra APK
        run: |
          cd android

          chmod +x gradlew

          echo "================================"
          echo "   BUILDING TEST MITRA APK"
          echo "================================"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # 16. Check APK
      - name: Check Generated APK
        run: |
          echo "=== Searching for APK ==="

          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "================================"
          echo "APK GENERATED SUCCESSFULLY"
          echo "================================"


      # 17. Upload APK
      - name: Upload Test Mitra APK
        uses: actions/upload-artifact@v4
        with:
          name: TestMitra-Latest-APK
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error
