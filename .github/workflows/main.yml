name: Build Android APK from Zip or Repo

on:
  push:
    branches: [ main, master ]

  workflow_dispatch:
    inputs:
      zip_url:
        description: 'Optional direct URL to download zip (leave empty if repo contains code)'
        required: false
        default: ''

jobs:
  build-apk:
    name: Auto Extract & Build Test Mitra APK
    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4


      # Step 2: Auto Find & Extract ZIP
      - name: Auto Find & Extract Zip File
        run: |
          echo "=== Checking for ZIP files ==="

          if [ -n "${{ github.event.inputs.zip_url }}" ]; then
            echo "Downloading ZIP..."
            curl -L "${{ github.event.inputs.zip_url }}" -o uploaded_app.zip
          fi

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP: $ZIP_FILE"
            
            rm -rf extracted_temp
            mkdir -p extracted_temp

            unzip -o "$ZIP_FILE" -d extracted_temp/

            echo "=== Detecting project root ==="

            if [ -f "extracted_temp/package.json" ]; then
              cp -r extracted_temp/* .
            else
              SUBDIR=$(find extracted_temp -mindepth 1 -maxdepth 1 -type d | head -n 1)

              if [ -n "$SUBDIR" ] && [ -f "$SUBDIR/package.json" ]; then
                cp -r "$SUBDIR"/* .
              else
                echo "No package.json found in ZIP root."
                find extracted_temp -maxdepth 3 -type f | head -n 50
              fi
            fi

            rm -rf extracted_temp

            echo "ZIP extraction completed."

          else
            echo "No ZIP found."
            echo "Building directly from repository."
          fi


      # Step 3: Setup Node.js
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json


      # Step 4: Install Dependencies
      - name: Install Dependencies
        run: |
          echo "=== Installing Node dependencies ==="

          if [ -f "package-lock.json" ]; then
            npm ci || npm install
          else
            npm install
          fi


      # Step 5: Build Web Application
      - name: Build Web Application
        run: |
          echo "=== Building Web Application ==="
          npm run build

          echo "=== Checking dist folder ==="

          if [ -d "dist" ]; then
            echo "dist folder found."
            ls -la dist
          else
            echo "ERROR: dist folder not found."
            exit 1
          fi


      # Step 6: Setup Java JDK 17
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'


      # Step 7: Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # Step 8: Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3


      # Step 9: Enable AndroidX
      - name: Enable AndroidX
        run: |
          echo "=== Enabling AndroidX ==="

          mkdir -p android

          touch android/gradle.properties

          if ! grep -q "^android.useAndroidX=" android/gradle.properties; then
            echo "android.useAndroidX=true" >> android/gradle.properties
          fi

          if ! grep -q "^android.enableJetifier=" android/gradle.properties; then
            echo "android.enableJetifier=true" >> android/gradle.properties
          fi

          if ! grep -q "^org.gradle.jvmargs=" android/gradle.properties; then
            echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> android/gradle.properties
          fi

          echo "=== gradle.properties ==="
          cat android/gradle.properties


      # Step 10: Sync Web Files to Android Assets
      - name: Sync Assets to Android Project
        run: |
          echo "=== Preparing Android assets ==="

          mkdir -p android/app/src/main/assets/public

          rm -rf android/app/src/main/assets/public/*

          cp -r dist/* android/app/src/main/assets/public/

          echo "=== Assets copied successfully ==="

          ls -la android/app/src/main/assets/public/


      # Step 11: Prepare Gradle Wrapper
      - name: Prepare Gradle Wrapper
        run: |
          cd android

          echo "=== Creating Gradle Wrapper ==="

          gradle wrapper \
            --gradle-version 8.2 \
            --distribution-type all

          chmod +x gradlew

          echo "Gradle wrapper ready."


      # Step 12: Clean Android Project
      - name: Clean Android Project
        run: |
          cd android

          chmod +x gradlew

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # Step 13: Build Debug APK
      - name: Build Test Mitra APK
        run: |
          cd android

          chmod +x gradlew

          echo "=== Building TEST MITRA APK ==="

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # Step 14: Check APK
      - name: Check Generated APK
        run: |
          echo "=== Searching for APK ==="

          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully."


      # Step 15: Upload APK
      - name: Upload Test Mitra APK
        uses: actions/upload-artifact@v4
        with:
          name: TestMitra-Latest-APK
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error
